supported_proposition: >-
  At the exact ZKP revision pinned by #65, the requirements define context as a bounded
  intentional linkability domain and require presentations to bind a canonical,
  domain-separated transcript that commits to audience, challenge/nonce, session where
  defined, requested predicates, policy/freshness boundaries, context/scope where linkability
  is used, and proof-suite identity. The repository tree at this same revision contains the
  requirements document but no later conformance-fixture or composed-presentation executable
  evidence tree. This establishes a source-defined transcript/context correlation surface and
  an executable-evidence version gap; it does not establish the transcript commitments actually
  observed by verifier context B.
