supported_proposition: >-
  At the pinned Trust Tasks revision, issuedAt is a protocol time surface and expiresAt may
  bound validity; the privacy guidance explicitly recognizes that full timestamp precision
  can fingerprint or join activity and permits coarsening where appropriate. This establishes
  a specification-defined temporal correlation surface, not the timestamps or freshness
  observations actually visible in relying context B.
