flow_id: RF-001
findings:
  - id: RF-001-F001
    type: upstream-dependency
    title: Trust Task binding semantics remain unresolved for privacy-preserving relationship proof
    owner: DTG Trust Tasks
    repository: trustoverip/dtgwg-trust-tasks-spec
    status: resolved
    severity: high
    dpip_impact: [C3-R2, C3-T4, C3-PC-2]
    assumptions: [A-2]
    evidence:
      - RF-001 S-03 records the original unresolved exchange/task-context boundary
      - Trust Tasks source-backed envelope/thread evidence is now explicitly acquired and kept distinct from runtime observation
      - DPIP executable threadId reuse calibration proves the prohibited cross-context join is mechanically detectable
      - missing authoritative implementation observations now terminate INDETERMINATE/evidence-required with a bounded remediation contract
    disposition: >-
      Resolved as a v0.1 release blocker, not as a universal privacy PASS. DPIP now has an explicit,
      executable and fail-closed contract for the binding/correlation surface. Implementations still
      require attributable evidence before a scoped PASS can be returned.
    promotion:
      state: resolved-regression
      target_type: dpip-test
      target_refs: [C3-T4]
      rationale: The original semantic dead end is now represented as executable correlation testing plus deterministic evidence-required behavior.
      regression_refs: [C3-R2, C3-T4, C3-PC-2]
  - id: RF-001-F002
    type: evidence-gap
    title: C3 proof construction evidence is candidate rather than immutable verified evidence
    owner: DTG ZKP
    repository: sankarshanmukhopadhyay/dtgwg-zkp-tf
    status: candidate
    severity: high
    dpip_impact: [C3-R2, C3-R4, C3-T1, C3-T6, C3-PC-1, C3-PC-2, C3-PC-4]
    assumptions: [A-3]
    evidence: [sankarshanmukhopadhyay/dtgwg-zkp-tf#13]
    disposition: Retain candidate evidence and do not promote the strongest composed-presentation claim until a commit-, test-vector-, or release-pinned artifact exists.
    promotion:
      state: candidate
      target_type: none
      rationale: Issue-level evidence remains a hypothesis/input until immutable construction evidence exists.
  - id: RF-001-F003
    type: privacy-overclaim
    title: Pairwise private-half scope cannot be inherited as relationship-level unlinkability
    owner: DPIP composition assessment
    status: resolved
    severity: high
    dpip_impact: [C3-R4, C3-R5, C3-R8, C3-T2, C3-T3, C3-T7, C3-PC-3, C3-PC-5]
    evidence:
      - RF-001 S-02 private-half-b is pairwise while public-half-a is public/community observable
      - RF-001 S-06 publishes or retains a relationship graph signal
    disposition: Resolved by scoped claims plus declared/observable/effective correlation scope; relationship unlinkability remains FAIL and contextual privacy CONSTRAINED.
    promotion:
      state: resolved-regression
      target_type: dpip-test
      target_refs: [C3-T2, C3-T3, C3-T7]
      rationale: The finding is now encoded as repeatable negative/adversarial conformance behavior rather than remaining a prose observation.
      regression_refs: [C3-R4, C3-R5, C3-R8, C3-PC-3, C3-PC-5]
  - id: RF-001-F004
    type: implementation-assumption
    title: Privileged operator views may reconstruct correlation excluded from ordinary verifier views
    owner: deployment / relationship service
    status: open
    severity: high
    dpip_impact: [P2, P4, P6, C3-R5, C3-PC-5]
    evidence: [RF-001 S-06 administrator relationship view has privileged-deployment effective scope]
    disposition: Deployment guidance must require explicit privileged-observer analysis, retention purpose, access controls, and claim scoping.
    promotion:
      state: promoted-dpip
      target_type: dpip-guidance
      target_refs: [docs/deployment-guide/rf-001-implementation-guidance.md]
      rationale: The stable implementation risk has been promoted into deployer guidance while remaining deployment-specific.
  - id: RF-001-F005
    type: upstream-dependency
    title: Reciprocal relationship semantics remain externally owned and must not be invented by DPIP
    owner: DTG Credentials
    repository: trustoverip/dtgwg-cred-spec
    status: candidate
    severity: medium
    dpip_impact: [C2, C3, C3-R1, C3-R6]
    assumptions: [A-1]
    evidence:
      - RF-001 S-02 treats reciprocal relationship semantics as credential-layer owned
      - sankarshanmukhopadhyay/dtgwg-zkp-tf#13 records the cross-spec boundary
    disposition: Continue testing the integration hypothesis while keeping the semantic dependency explicit; raise upstream only where DPIP needs a concrete unresolved interface/definition needed for conformance.
    promotion:
      state: reviewed
      target_type: upstream-issue
      rationale: The semantic dependency is understood, but no new upstream issue should be raised until DPIP has a concrete unresolved interface/definition needed for conformance.
