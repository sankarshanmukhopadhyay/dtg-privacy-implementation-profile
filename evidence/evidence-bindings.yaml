schema: dpip-evidence-binding/v1
bindings:
  - id: relationship-correlation-privacy
    match:
      interactions_any: [C3, C5]
      claims_any: [C3-PC-2, C5-PC-2, C3-PC-4, C3-PC-5, C5-PC-4]
    evidence_requirement_ids:
      - ER-REL-DID-AB
      - ER-STATUS-AB
      - ER-TASK-AB
      - ER-VERIFIER-AB

  - id: credential-identifier-cross-context-correlation
    match:
      claims_any: [C3-PC-2]
      surfaces_any:
        - credential identifier
        - credential identifier cross-context correlation
    evidence_requirement_ids:
      - ER-CREDENTIAL-ID-AB
