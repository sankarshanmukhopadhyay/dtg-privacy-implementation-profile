    revision: "55771f2f2927876c1498059e53d830070b97482d"
    artifact:
      kind: path
      locator: docs/implementation-guide/conformance/composed-presentation-test-matrix.csv
    evidence_kind: adversarial
    supports:
      - target_type: requirement
        target_id: C7-R2
      - target_type: requirement
        target_id: C7-R8
      - target_type: privacy-claim
        target_id: C7-PC-4
      - target_type: test
        target_id: C7-T3
      - target_type: test
        target_id: C7-T7
    scope:
      subject: contextual-graph
      statement: >-
        Asymmetric-edge composed-presentation cases demonstrate that proof-level hiding or
        validity cannot be promoted to relationship or contextual unlinkability when a public
        reciprocal half, reusable binder, or joinable graph context broadens effective correlation.
    limitations:
      - This evidence constrains over-claiming; it does not prove that a concrete C7 presentation is unlinkable.
      - Cross-verifier PASS requires observations from independently generated concrete presentations.
    owner_normative_status: experimental
    provenance:
      captured_from: "dtgwg-zkp-tf issue #13 pressure test"
      notes: >-
        These cases are deliberately reusable by C7 because ADR P4/P5 require cross-verifier
        unlinkability and outcome-only disclosure at the composed interaction boundary.
