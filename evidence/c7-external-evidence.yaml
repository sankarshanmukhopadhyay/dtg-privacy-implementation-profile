    evidence_kind: semantic
    supports:
      - target_type: requirement
        target_id: C7-R3
      - target_type: requirement
        target_id: C7-R5
      - target_type: test
        target_id: C7-T2
      - target_type: test
        target_id: C7-T5
    scope:
      subject: proof-construction
      statement: >-
        Machine-readable semantic evidence distinguishing valid, rejected, privacy-failing,
        and indeterminate Community-Anchored Proof conditions, including explicit refusal
        to treat missing independently checkable Clause 3 evidence as a PASS.
    limitations:
      - These are semantic conformance vectors, not a production zero-knowledge proof implementation.
      - The binding does not establish a concrete offline third-party membership construction for ADR Clause 3.
      - Positive privacy claims remain INDETERMINATE until concrete proof, registry, and observation evidence is supplied.
    owner_normative_status: experimental
    provenance:
      captured_from: "dtgwg-zkp-tf issue #14 implementation work"
      notes: >-
        The referenced revision contains the Community-Anchored Proof scenario, semantic vectors,
        tests, and construction-neutral Clause 3 input contract.

  - id: EV-C7-2
    maturity: candidate
    repository: sankarshanmukhopadhyay/dtgwg-zkp-tf
    revision: "55771f2f2927876c1498059e53d830070b97482d"
    artifact:
      kind: path
      locator: docs/implementation-guide/interoperability/community-anchored-proof-input-contract.md
    evidence_kind: protocol-interface
    supports:
      - target_type: requirement
        target_id: C7-R4
