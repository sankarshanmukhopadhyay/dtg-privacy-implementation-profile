        target_id: C7-R5
      - target_type: requirement
        target_id: C7-R7
      - target_type: test
        target_id: C7-T1
      - target_type: test
        target_id: C7-T4
    scope:
      subject: presentation
      statement: >-
        Construction-neutral contract for the Credential and Registry evidence required to
        support offline counterparty membership, currentness, challenge binding, and private
        status evaluation without manufacturing missing semantics in DPIP or the ZKP layer.
    limitations:
      - The contract records required semantics and evidence classes but does not instantiate a registry interface.
      - Credential issuance-time inputs and concrete membership witnesses remain external dependencies.
      - This binding cannot upgrade ACCEPTS or CURRENT from INDETERMINATE without execution evidence.
    owner_normative_status: experimental
    provenance:
      captured_from: "ADR-001 dependency analysis"
      notes: >-
        Source ADR: https://docs.fpp.storm.ws/dtg-community-anchored-proof-adr.html

  - id: EV-C7-3
    maturity: candidate
