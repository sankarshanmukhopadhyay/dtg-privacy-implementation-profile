schema: dpip-evidence-requirement-registry/v1
version: 1
requirements:
  - id: ER-REL-DID-AB
    version: 1
    title: Relationship identifier cross-context unlinkability
    proposition:
      interactions: [C3]
      claims: [C3-PC-2, C3-PC-4, C3-PC-5]
      invariants: [P2, P4, P5]
      profiles: [PP-4, PP-2]
    accepted_evidence_classes: [runtime-upstream-observation]
    experiment:
      kind: unlinkability-pressure-case
      contexts: 2
      expected_join: must-not-emerge
