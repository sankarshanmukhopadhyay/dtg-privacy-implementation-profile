# DPIP-to-RAHP disposition return workflow
#
# Purpose:
#   Persist and deliver terminal DPIP dispositions back to their originating RAHP issue
#   through the durable outbox/acknowledgement contract. Scheduled runs retry pending
#   delivery; they do not recompute the examination.
#
# Side effects:
#   Writes DPIP outbox/ack state and may update the originating RAHP issue.
#
# Boundary:
#   Successful delivery means RAHP received the DPIP disposition. It does NOT imply
#   RAHP portfolio GREEN or alter the returned privacy conclusion.
#
name: Return completed DPIP dispositions to RAHP

on:
  issues:
    types: [labeled]
  schedule:
    # Recovery reconciliation; normal return is event-driven from run:complete.
    - cron: '47 * * * *'
  workflow_dispatch:
    inputs:
      issue_number:
        description: Optional DPIP issue number to reconcile
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: dpip-rahp-return-${{ github.event.issue.number || inputs.issue_number || 'reconcile' }}
  cancel-in-progress: false

jobs:
  return-disposition:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'issues' && github.event.label.name == 'run:complete')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Validate return contract and durable outbox
        run: python scripts/rahp_return.py --self-test
      - name: Require RAHP return credential
        env:
          RAHP_HANDOFF_TOKEN: ${{ secrets.RAHP_HANDOFF_TOKEN }}
        shell: bash
        run: |
          if [ -z "${RAHP_HANDOFF_TOKEN:-}" ]; then
            echo '::error::RAHP_HANDOFF_TOKEN is not configured; completed DPIP dispositions remain retryable but cannot yet be delivered.'
            exit 2
          fi
      - name: Persist outbox, deliver and acknowledge disposition
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RAHP_HANDOFF_TOKEN: ${{ secrets.RAHP_HANDOFF_TOKEN }}
          DPIP_REPOSITORY: sankarshanmukhopadhyay/dtg-privacy-implementation-profile
          RAHP_REPOSITORY: sankarshanmukhopadhyay/rahp-toolkit
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
          INPUT_ISSUE_NUMBER: ${{ inputs.issue_number }}
        shell: bash
        run: |
          issue_number="${EVENT_ISSUE_NUMBER:-${INPUT_ISSUE_NUMBER:-}}"
          if [ -n "$issue_number" ]; then
            python scripts/rahp_return.py --issue-number "$issue_number"
          else
            python scripts/rahp_return.py
          fi
