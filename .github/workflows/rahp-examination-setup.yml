# DPIP RAHP examination setup workflow
#
# Purpose:
#   Materialize deterministic examination setup for admitted RAHP-originated requests
#   and dispatch evidence planning. Scheduled runs are recovery reconciliation only.
#
# Side effects:
#   May write structured setup records to DPIP issues and dispatch downstream workflows.
#
# Boundary:
#   Setup prepares scope/bindings; it does NOT execute the privacy examination or
#   establish evidence sufficiency or a privacy conclusion.
#
name: Prepare admitted RAHP privacy examinations

on:
  issues:
    types: [labeled]
  schedule:
    # Recovery reconciliation; normal progression is explicitly dispatched.
    - cron: '27 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/rahp-examination-setup.yml'
      - '.github/workflows/rahp-evidence-plan.yml'
      - '.github/workflows/rahp-examination-execute.yml'
      - '.github/workflows/rahp-return.yml'
      - 'scripts/examination_setup.py'
      - 'scripts/evidence_plan.py'
      - 'scripts/evidence_acquire.py'
      - 'scripts/examination_execute.py'
  workflow_dispatch:
    inputs:
      issue_number:
        description: Optional admitted DPIP issue number to prepare
        required: false
        type: string

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: dpip-examination-setup-${{ github.event.issue.number || inputs.issue_number || 'reconcile' }}
  cancel-in-progress: false

jobs:
  setup:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event_name == 'push' ||
      (github.event_name == 'issues' && github.event.label.name == 'run:in-progress')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Validate examination setup processor
        run: python scripts/examination_setup.py --self-test
      - name: Prepare admitted examination and collect targets
        id: targets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          DPIP_REPOSITORY: sankarshanmukhopadhyay/dtg-privacy-implementation-profile
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
          INPUT_ISSUE_NUMBER: ${{ inputs.issue_number }}
        shell: bash
        run: |
          set -euo pipefail
          issue_number="${EVENT_ISSUE_NUMBER:-${INPUT_ISSUE_NUMBER:-}}"
          if [ -n "$issue_number" ]; then
            python scripts/examination_setup.py --issue-number "$issue_number"
            printf '%s\n' "$issue_number" > /tmp/dpip-setup-targets.txt
          else
            : > /tmp/dpip-setup-targets.txt
            gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&labels=run%3Ain-progress&per_page=100" --jq '.[].number' |
              while read -r number; do
                [ -n "$number" ] || continue
                python scripts/examination_setup.py --issue-number "$number"
                printf '%s\n' "$number" >> /tmp/dpip-setup-targets.txt
              done
          fi
      - name: Dispatch evidence planning for prepared examinations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          while read -r number; do
            [ -n "$number" ] || continue
            if gh api "repos/${GITHUB_REPOSITORY}/issues/${number}/comments?per_page=100" --jq '.[].body' | grep -q 'dpip-examination-setup:'; then
              gh workflow run rahp-evidence-plan.yml -f issue_number="$number"
            fi
          done < /tmp/dpip-setup-targets.txt
