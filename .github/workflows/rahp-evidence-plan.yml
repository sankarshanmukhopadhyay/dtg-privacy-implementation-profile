name: Compile DPIP evidence acquisition plans

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: DPIP issue number with an examination_setup record
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  plan-and-acquire:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, 'dpip-examination-setup:'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Validate evidence-plan compiler
        run: python scripts/evidence_plan.py --self-test
      - name: Validate deterministic acquisition runner
        run: python scripts/evidence_acquire.py --self-test
      - name: Resolve issue number
        id: issue
        env:
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
          INPUT_ISSUE_NUMBER: ${{ inputs.issue_number }}
        shell: bash
        run: |
          issue_number="${EVENT_ISSUE_NUMBER:-${INPUT_ISSUE_NUMBER:-}}"
          if [ -z "$issue_number" ]; then
            echo 'No issue number resolved' >&2
            exit 2
          fi
          echo "number=$issue_number" >> "$GITHUB_OUTPUT"
      - name: Compile and publish acquisition plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DPIP_REPOSITORY: sankarshanmukhopadhyay/dtg-privacy-implementation-profile
        run: python scripts/evidence_plan.py --issue-number '${{ steps.issue.outputs.number }}'
      - name: Acquire evidence from the published plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DPIP_REPOSITORY: sankarshanmukhopadhyay/dtg-privacy-implementation-profile
        run: python scripts/evidence_acquire.py --issue-number '${{ steps.issue.outputs.number }}'
