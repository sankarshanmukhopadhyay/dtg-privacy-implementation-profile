name: Validate DPIP profiles

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validation dependencies
        run: pip install -r requirements-dev.txt
      - name: Validate interaction profiles
        run: python scripts/validate_profiles.py
      - name: Validate executable observation fixtures
        run: python scripts/validate_observations.py
      - name: Pressure-test observation semantics
        run: python scripts/validate_observations.py --self-test
      - name: Execute protected-access DPIP evaluation
        run: >-
          python scripts/evaluate_interaction.py
          --profile examples/c8-protected-access.yaml
          --evidence observations/c8-protected-access.yaml
          --output-dir results
          --check
      - name: Validate external evidence bindings
        run: python scripts/validate_evidence.py
      - name: Validate conformance results
        run: python scripts/validate_results.py
      - name: Validate composed reference flows
        run: python scripts/validate_reference_flows.py
      - name: Validate findings and v0.1 readiness
        run: python scripts/validate_findings_readiness.py
      - name: Validate portfolio change-impact metadata
        run: python scripts/validate_change_impact.py
      - name: Validate RAHP intake admission transport
        run: python scripts/rahp_intake.py --self-test
      - name: Validate RAHP examination setup
        run: python scripts/examination_setup.py --self-test
      - name: Validate evidence acquisition planning
        run: python scripts/evidence_plan.py --self-test
      - name: Validate deterministic evidence collectors
        run: python scripts/evidence_acquire.py --self-test
      - name: Validate repository-native examination execution
        run: python scripts/examination_execute.py --self-test
      - name: Validate RAHP return transport
        run: python scripts/rahp_return.py --self-test
      - name: Validate release governance and lake pool
        run: python scripts/release_governance.py self-test
