version: 1
purpose: >-
  Map examination evidence-surface language to deterministic acquisition tasks. These
  rules describe what must be observed and by whom; they do not assert that an observation
  exists and do not determine privacy outcome.

contexts:
  - id: A
    role: relying-context-a
    relationship: unrelated
  - id: B
    role: relying-context-b
    relationship: unrelated

surface_rules:
  "trust-task id/threadId/ceremony.enactment":
    component: Trust Tasks
    observer: relying-party
    collector: trust-task-envelope
    retention_stage: post-task-retained
    falsification_purpose: Determine whether task/thread/ceremony values are stable or reusable across unrelated relying contexts.
  "timestamps and freshness metadata":
    component: Trust Tasks / lifecycle layer
    observer: relying-party-or-status-source
    collector: temporal-freshness
    retention_stage: post-task-retained
    falsification_purpose: Determine whether timing/freshness observations create a reliable cross-context correlation path.
  "proof transcript context commitment":
    component: ZKP presentation
    observer: verifier
    collector: zkp-context-commitment
    retention_stage: presentation-and-retained-proof
    falsification_purpose: Determine whether proof-visible binding material is reusable or joinable across unrelated relying contexts.
  "credential/status lookup evidence":
    component: Credential/status layer
    observer: status-source-or-verifier
    collector: credential-status
    retention_stage: lookup-and-log-retention
    falsification_purpose: Determine whether status/freshness lookup handles correlate presentations across unrelated relying contexts.
  "retained Trust Task documents":
    component: Trust Tasks
    observer: relying-party-or-operator
    collector: trust-task-retention
    retention_stage: retained-document
    falsification_purpose: Determine whether retained task documents preserve stable values that collapse declared pairwise scope.
  "outcome receipts and audit evidence":
    component: outcome/audit layer
    observer: relying-party-or-operator
    collector: outcome-audit
    retention_stage: post-outcome-audit
    falsification_purpose: Determine whether outcome or audit records contain a durable join key across unrelated relying contexts.
  "relationship DID and edge identifiers":
    component: Credential / relationship edge layer
    observer: relying-party-or-verifier
    collector: credential-status
    retention_stage: presentation-and-retained-relationship
    falsification_purpose: Determine whether relationship DID or edge identifiers expose a stable or reusable value that joins unrelated relying contexts beyond declared correlation scope.
  "status and policy discovery traffic":
    component: Credential/status/policy discovery layer
    observer: status-source-or-verifier
    collector: credential-status
    retention_stage: lookup-and-log-retention
    falsification_purpose: Determine whether status or policy-discovery requests, handles, or responses create a reliable cross-context correlation path.
  "retained relationship evidence":
    component: Relationship / Trust Tasks evidence layer
    observer: relying-party-or-operator
    collector: trust-task-retention
    retention_stage: retained-document
    falsification_purpose: Determine whether retained relationship evidence preserves stable identifiers or metadata that collapses declared pairwise scope.
  "deliberate-correlation mechanisms":
    component: Relationship / presentation layer
    observer: verifier-or-relying-party
    collector: zkp-context-commitment
    retention_stage: presentation-and-retained-proof
    falsification_purpose: Determine whether the deliberate-correlation mechanism remains bounded to its declared context or becomes reusable across unrelated relying contexts.


  "device or install display metadata":
    component: Device presence / heartbeat layer
    observer: presence-service-or-operator
    collector: device-presence
    retention_stage: heartbeat-and-retained-binding
    falsification_purpose: Determine whether a human-readable device/install name is stable or reusable across unrelated operational contexts.
  "heartbeat payloads":
    component: Device presence / heartbeat layer
    observer: presence-service
    collector: device-presence
    retention_stage: protocol-envelope
    falsification_purpose: Determine whether heartbeat-visible metadata creates a stable cross-context join path beyond the declared device binding.
  "retained presence records":
    component: Device presence / retained state
    observer: operator-or-presence-service
    collector: device-presence
    retention_stage: retained-presence-record
    falsification_purpose: Determine whether retained presence metadata is reused or exposed across contexts beyond its operational purpose.

  "applicant-scoped masked vetter tags":
    component: VTI hidden-vetter admission
    observer: community-or-retained-data-consumer
    collector: vti-hidden-vetter-runtime
    retention_stage: admission-and-retained-facts
    falsification_purpose: Determine whether masked vetter representations remain bounded to one applicant/community context or create a reusable join.
  "community masking-key derivation material":
    component: VTI hidden-vetter masking
    observer: community
    collector: vti-hidden-vetter-runtime
    retention_stage: community-key-retention
    falsification_purpose: Determine whether authorized derivation material plus retained identity permits vetter re-identification or correlation beyond the declared boundary.
  "applicant DID retained alongside decision/facts state":
    component: VTI hidden-vetter retained facts
    observer: community-or-retained-data-consumer
    collector: vti-hidden-vetter-runtime
    retention_stage: post-decision-retained
    falsification_purpose: Determine whether retained applicant identity composes with masked or derived vetter state into a stable join.
  "enrolment table":
    component: VTI hidden-vetter enrolment
    observer: community
    collector: vti-hidden-vetter-runtime
    retention_stage: enrolment-retained
    falsification_purpose: Determine whether enrolment state exposes a stable vetter/applicant linkage across unrelated contexts.
  "spent-token ledger":
    component: VTI hidden-vetter token state
    observer: community
    collector: vti-hidden-vetter-runtime
    retention_stage: post-token-spend
    falsification_purpose: Determine whether spent-token records create an unintended durable linkage across submissions or applicants.
  "redacted hidden-vetting submission digest":
    component: VTI hidden-vetter decision evidence
    observer: community-or-retained-data-consumer
    collector: vti-hidden-vetter-runtime
    retention_stage: post-decision-redacted
    falsification_purpose: Determine whether retained redaction digests or adjacent facts preserve a reusable join after hidden proof material is removed.

  "pairwise relationship DID":
    component: Relationship / witness composition
    observer: witness-or-relying-party
    collector: composed-identifier-runtime
    retention_stage: witness-exchange
    falsification_purpose: Determine whether a pairwise relationship DID becomes a reusable join across unrelated contexts.
  "member DID in memberPresentation":
    component: Witness member-link presentation
    observer: witness
    collector: composed-identifier-runtime
    retention_stage: witness-exchange
    falsification_purpose: Determine whether optional member-link disclosure creates a stable cross-context join beyond the declared witness purpose.
  "counterparty DID":
    component: Relationship / witness composition
    observer: witness-or-relying-party
    collector: composed-identifier-runtime
    retention_stage: witness-exchange
    falsification_purpose: Determine whether counterparty identity becomes a reusable cross-context correlator.
  "witness DID":
    component: Witness selection
    observer: relying-party-or-operator
    collector: composed-identifier-runtime
    retention_stage: witness-exchange
    falsification_purpose: Determine whether witness selection metadata enables unintended context joining.
  "session/thread identifier":
    component: Witness session
    observer: witness-or-operator
    collector: composed-identifier-runtime
    retention_stage: active-and-retained-session
    falsification_purpose: Determine whether session/thread identifiers remain context-scoped across unrelated witness interactions.
  "VWC and relationship-credential digests":
    component: Witness credential/evidence
    observer: witness-or-operator
    collector: retained-privacy-runtime
    retention_stage: accepted-evidence-retention
    falsification_purpose: Determine whether retained digests create a durable cross-context join.
  "retained witness:session and witness:outcome evidence":
    component: Witness retained evidence
    observer: operator-or-evidence-consumer
    collector: retained-privacy-runtime
    retention_stage: post-acceptance-retained
    falsification_purpose: Determine whether retained witness evidence exceeds the declared correlation and purpose boundary.
  "audit caller/context/session/witness fields":
    component: Witness audit layer
    observer: operator-or-auditor
    collector: retained-privacy-runtime
    retention_stage: audit-retention
    falsification_purpose: Determine whether audit metadata creates a durable join across otherwise unrelated contexts.

  "community-scoped directory entryId":
    component: Community directory
    observer: directory-viewer-or-client
    collector: composed-identifier-runtime
    retention_stage: directory-read
    falsification_purpose: Determine whether entry identifiers become reusable outside the intended community/context scope.
  "directoryRef vtcDid plus entryId":
    component: Holder-local directory join
    observer: holder-client
    collector: composed-identifier-runtime
    retention_stage: local-contact-rendering
    falsification_purpose: Determine whether the local join reference escapes holder scope or enables cross-community joining.
  "membership DID visibility":
    component: Community directory
    observer: directory-viewer
    collector: composed-identifier-runtime
    retention_stage: directory-read
    falsification_purpose: Determine whether membership identifiers create unintended cross-context linkage.
  "group identifiers and membership":
    component: Community groups/directory
    observer: group-or-directory-viewer
    collector: composed-identifier-runtime
    retention_stage: group-directory-read
    falsification_purpose: Determine whether group metadata permits joining people or relationships beyond the declared audience.
  "directory search, facets and enumeration behavior":
    component: Community directory search
    observer: directory-viewer
    collector: composed-identifier-runtime
    retention_stage: query-response
    falsification_purpose: Determine whether search/facet behavior provides a membership or relationship oracle across contexts.
  "statementDigest and join-manifest disclosure":
    component: Pre-application disclosure
    observer: prospective-applicant
    collector: retained-privacy-runtime
    retention_stage: pre-application-discovery
    falsification_purpose: Determine whether disclosure metadata or digest creates a person-specific or cross-context join.
  "external-card publication":
    component: Directory external publication
    observer: external-viewer
    collector: retained-privacy-runtime
    retention_stage: published-card
    falsification_purpose: Determine whether external publication exceeds the declared purpose/audience boundary.
  "admin-note existence":
    component: Directory administration
    observer: authorized-administrator
    collector: retained-privacy-runtime
    retention_stage: administrative-read
    falsification_purpose: Determine whether note-existence metadata expands correlation or inference beyond the intended admin purpose.
  "administrator event timing/topic metadata":
    component: Directory/groups event hints
    observer: authorized-administrator
    collector: retained-privacy-runtime
    retention_stage: event-stream
    falsification_purpose: Determine whether hint timing/topic creates a durable person/group join despite identifier minimization.

join_policy:
  contexts: [A, B]
  basis: Compare normalized observations for stable/reusable values or deterministic derivations across unrelated relying contexts.
  expected_question: Does the observed surface permit the same subject or relationship to be joined across A and B beyond its declared scope?

judgment_boundary:
  applicability: not-made
  privacy_judgment: not-made
  human_acceptance_required: true
