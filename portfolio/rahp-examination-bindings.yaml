version: 2
status: candidate-binding-registry
purpose: >-
  Provide explicit, reviewable mappings from RAHP-originated privacy examination language
  to existing DPIP interactions, profiles, invariants and scoped claims. These mappings
  identify candidate examination setup only; they do not establish applicability or a
  privacy disposition.

invariant_aliases:
  no-unnecessary-cross-context-correlation: [P2, P4]
  correlation-scope-does-not-expand-through-composition: [P2, P4, P5]
  retained-evidence-does-not-defeat-selective-disclosure: [P3, P4, P5, P6]
  metadata-does-not-expand-declared-correlation-scope: [P2, P4, P5, P6]
  pre-admission-discovery-does-not-require-unnecessary-stable-identity-disclosure: [P1, P2, P4, P5]
  directory-disclosure-is-bounded-to-purpose-and-policy: [P1, P2, P4, P5, P6]
  status-discovery-does-not-expand-correlation-scope: [P2, P4, P5]
  holder-private-annotations-do-not-leave-holder-context: [P1, P2, P4, P5]
  directory-nonvisibility-does-not-become-membership-or-relationship-oracle: [P1, P2, P4]
  disclosure-purpose-and-audience-remain-bounded: [P1, P4, P5, P6]
  retained-or-derived-metadata-does-not-defeat-local-only-annotation-boundary: [P2, P4, P5, P6]

interaction_aliases:
  device-presence-and-metadata:
    canonical: [C5]
    rationale: >-
      Device heartbeat/presence is a lifecycle/presence interaction whose privacy
      question is whether protocol-envelope and retained operational metadata become
      a reusable correlator. C5 already owns lifecycle/status metadata, protocol-envelope
      privacy and retained-state correlation surfaces; this mapping does not turn
      device presence into credential status semantics.

  credential-proof-trust-task-consequential-execution:
    canonical: [C3, C5]
    rationale: >-
      C3 covers cross-context/composed relationship and presentation correlation; C5
      covers Trust Task freshness, status-query privacy, retained lifecycle state and
      historical correlation. Neither mapping extends DPIP into RAHP authority or replay
      findings.

  pre-admission-manifest-discovery:
    canonical: [C4]
    rationale: >-
      The manifest request is a pre-flight discovery interaction. C4 already owns the
      proposition that discovery should not require unnecessary durable requester identity,
      relationship intent or protocol-envelope correlation before establishment.

  vetter-directory-discovery:
    canonical: [C3, C4]
    rationale: >-
      Directory lookup is both discovery and relationship-context composition: C4 covers
      requester/discovery minimisation while C3 covers whether the vetter DID and profile
      metadata become joinable across contexts. This does not make directory membership a
      relationship proof.

  vetting-request-and-ticket-exchange:
    canonical: [C3]
    rationale: >-
      The ticket/request path participates in establishing the vetted relationship and may
      expose a reusable binder or contextual graph signal. C3 owns that scoped correlation
      proposition; ticket validity/authority remains outside DPIP.

  vta-witness-member-link:
    canonical: [C3, C5]
    rationale: >-
      A witnessed relationship composes relationship identity, third-party observation and
      retained task/evidence state. C3 owns cross-context relationship correlation and C5
      owns retained lifecycle/task metadata. Witness authority semantics remain outside DPIP.

  holder-directory-composition:
    canonical: [C3, C4]
    rationale: >-
      Client-local contact annotations joined to a community directory combine relationship
      context and discovery/publication surfaces. C3 covers composed linkability; C4 covers
      discovery and directory minimisation.

  community-directory-discovery:
    canonical: [C3, C4]
    rationale: >-
      Directory browse/search/show is both discovery and a possible cross-context identifier
      surface. This mapping does not treat directory output as identity proof or authority.

  directory-disclosure-manifest:
    canonical: [C4]
    rationale: >-
      Pre-application disclosure is a discovery/publication interaction. C4 owns minimisation
      and pre-establishment observability.

  directory-admin-event-hints:
    canonical: [C5]
    rationale: >-
      Administrator event hints are retained/operational metadata whose privacy question is
      whether timing/topic or identifiers expand correlation scope.

  vetter-grant-status-check:
    canonical: [C5]
    rationale: >-
      The grant-status fetch is a lifecycle/status-discovery interaction whose endpoint,
      handle, timing and retained state are already within C5's privacy boundary.

reference_flow_aliases:
  "device/install -> heartbeat or presence update -> retained service metadata":
    canonical: [RF-003]
    rationale: >-
      RF-003 is the existing lifecycle/freshness composition anchor. The mapping is
      limited to privacy-relevant observation and retention surfaces, not authority
      or device-registration semantics.

  "DTG Credential -> ZKP presentation -> Trust Task -> retained outcome evidence":
    canonical: [RF-001, RF-003]
    rationale: >-
      RF-001 covers relationship establishment/proof composition; RF-003 covers lifecycle,
      freshness, status and retained-history privacy. These are candidate reference-flow
      anchors, not evidence that the requested interaction is already fully instantiated.

  "active persona DID -> community manifest request -> pre-admission community observation":
    canonical: [RF-002]
    rationale: >-
      RF-002 is the existing privacy-preserving discovery flow and is the narrowest
      canonical anchor for pre-admission manifest discovery. It does not imply that the
      manifest is itself policy or that identity disclosure is necessary.

  "vetter directory query -> DID/profile/location/contact/event metadata -> applicant UI":
    canonical: [RF-002, RF-001]
    rationale: >-
      RF-002 covers discovery/metadata exposure; RF-001 covers the relationship-establishment
      context in which the selected vetter becomes relevant. Neither mapping treats directory
      output as proof or authority.

  "out-of-band vetting ticket -> QR/link carrying ticket id and secret -> vetting request":
    canonical: [RF-001]
    rationale: >-
      The ticket binds a relationship-establishment request and is therefore examined at
      RF-001's composed relationship/proof boundary, while ticket authorization semantics
      remain owned by the source protocols.

  "relationship credential -> witness/session -> member-linked presentation -> VWC -> retained evidence":
    canonical: [RF-001, RF-003]
    rationale: >-
      RF-001 covers relationship establishment/proof composition and RF-003 covers retained
      lifecycle evidence. The mapping is privacy-only and does not decide witness authority.

  "private contact annotation -> directoryRef -> community directory entry -> client-local rendering":
    canonical: [RF-002, RF-001]
    rationale: >-
      RF-002 covers directory/discovery metadata; RF-001 covers the relationship-context join
      introduced by the local directory reference.

  "member card visibility -> policy/ceiling projection -> directory viewer":
    canonical: [RF-002]
    rationale: >-
      Directory projection is a discovery/publication flow whose privacy boundary is audience
      minimisation and non-enumeration.

  "directory configuration -> disclosure statement -> prospective applicant":
    canonical: [RF-002]
    rationale: >-
      The disclosure statement is pre-establishment discovery metadata.

  "directory/group change -> administrator hint -> authorized re-read":
    canonical: [RF-003]
    rationale: >-
      The hint is operational/lifecycle metadata; the subsequent authorized re-read remains
      under the source system's access-control authority.

  "verified vetter grant -> credentialStatus URL -> bounded HTTPS status fetch":
    canonical: [RF-003]
    rationale: >-
      RF-003 owns lifecycle/status observation, including privacy of status handles,
      endpoints and retained historical context.

claim_aliases:
  device-metadata-is-bounded-to-the-declared-operational-scope:
    canonical: [C5-PC-5]

  pairwise-identifiers-preserve-declared-correlation-scope:
    canonical: [C3-PC-2, C5-PC-2]
  zero-knowledge-disclosure-remains-private-after-task-wrapping:
    canonical: [C3-PC-4, C3-PC-5]
  retained-task-proof-status-and-outcome-evidence-do-not-enable-unintended-linkage:
    canonical: [C3-PC-5, C5-PC-2, C5-PC-4]

  vetted-admission-discloses-only-necessary-identity-and-contact-information:
    canonical: [C4-PC-1, C4-PC-2, C3-PC-4]
  directory-and-status-metadata-do-not-create-unintended-cross-context-linkage:
    canonical: [C3-PC-2, C3-PC-5, C5-PC-2, C5-PC-4]
  ticket-and-profile-state-do-not-expand-observer-or-retention-scope-beyond-the-declared-vetting-purpose:
    canonical: [C3-PC-4, C3-PC-5, C5-PC-4]

  pairwise-relationship-DID-remains-bounded-to-declared-context:
    canonical: [C3-PC-2, C5-PC-2]
  optional-member-link-disclosure-is-explicit-and-proportionate:
    canonical: [C3-PC-4, C3-PC-5]
  retained-session-and-outcome-evidence-do-not-create-unintended-linkage:
    canonical: [C3-PC-5, C5-PC-4]

  directoryRef-remains-holder-local-and-does-not-create-community-visible-social-graph:
    canonical: [C3-PC-2, C3-PC-4]
  stable-entry-identifiers-do-not-enable-unintended-cross-context-linkage:
    canonical: [C3-PC-2, C3-PC-5]
  membership-identifiers-and-group-data-remain-within-declared-audiences:
    canonical: [C3-PC-4, C4-PC-1, C4-PC-2]
  public-disclosure-statement-does-not-reveal-person-specific-state:
    canonical: [C4-PC-1, C4-PC-2]
  administrator-hints-do-not-leak-record-or-member-identities:
    canonical: [C5-PC-2, C5-PC-4]

profile_derivation:
  from_interactions: true
  rule: >-
    Candidate profiles are the target_profile values of all canonically mapped interactions.
    Multiple resulting profiles remain multiple candidates and MUST NOT be collapsed into a
    single applicability decision by the setup processor.

judgment_boundary:
  privacy_judgment: not-made
  applicability: not-made
  human_acceptance_required: true
